<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link href='http://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" type="text/css" href="styles/styles.css">
		<title>Render Catalogue Admin</title>
	</head>
	<body>
		<script>
function createImageURL(textureName) {
	var file = document.getElementById(textureName).files[0];
	var url = window.URL.createObjectURL(new Blob([file], {type: "image/png"}));
	return url;
}

function openPreviewWindow() {
	var basemap = createImageURL("basemap");
	var normal = createImageURL("normal");
	var metallic = createImageURL("metallic");
	var roughness = createImageURL("roughness");
	var AO = createImageURL("AO");
	var height = createImageURL("height");
	
	var url = "preview.html?data_id=&basemap="+basemap+"&normal="+normal+"&metallic="+metallic+"&roughness="+roughness+"&AO="+AO+"&height="+height;
	window.open(url,'popup','width=500,height=500');
}
		</script>

		<div class="navbar">
			<p class="title">Render Catalogue Admin</p>
		</div>

		<div class="content">
			<div class="section">
				<div class="section-title">
					<h2>Upload texture files</h2>
				</div>
	
				<div class="section-content">
					<form action="fileUpload.html" method="post" enctype="multipart/form-data">
						<label for="setid">Texture Set ID</label><br>
						<input id="setid" name="setid" type="text"/><br>
						<label for="basemap">Base Map:</label><br>
						<input id="basemap" name="basemap" type="file" accept="image/png"/><br>
						<label for="normal">Normal Map:</label><br>
						<input id="normal" name="normal" type="file" accept="image/png"/><br>
						<label for="metallic">Metallic Map:</label><br>
						<input id="metallic" name="metallic" type="file" accept="image/png"/><br>
						<label for="roughness">Roughness Map:</label><br>
						<input id="roughness" name="roughness" type="file" accept="image/png"/><br>
						<label for="AO">Ambient Occlusion Map:</label><br>
						<input id="AO" name="AO" type="file" accept="image/png"/><br>
						<label for="height">Height Map:</label><br>
						<input id="height" name="height" type="file" accept="image/png"/><br>
						<br><br>
						<input type = "submit" value="Upload"/>
						<input type="button" value="Preview" onclick="openPreviewWindow()"/>
					</form>
				</div>
			</div>

			<div class="section">
				<div class="section-title">
					<h2>Textures CMS</h2>
				</div>
	
				<div class="section-content">
					<div id="cmsList">
					</div>
				</div>
			</div>
		</div>
		
		
		<script src="scripts/materialLoader.js"></script>
		<script>
function createNumberField(form, id, labelText, min, max, step, defaultValue) {
	var label = document.createElement("label");
	label.setAttribute("for", id);
	label.append(labelText);
	var input = document.createElement("input");
	input.setAttribute("id", id);
	input.setAttribute("name", id);
	input.setAttribute("type", "number");
	input.setAttribute("min", min);
	input.setAttribute("max", max);
	input.setAttribute("step", step);
	input.setAttribute("value", defaultValue);
	form.appendChild(label);
	form.appendChild(input);
	form.appendChild(document.createElement("br"));
	return form;
}

var list = document.getElementById("cmsList");
loadMaterialData(function(material) {
	var header = document.createElement("h3");
	header.append(material.name);

	var form = document.createElement("form");
	form.setAttribute("action", "update");
	form.setAttribute("method", "post");
	var hiddenID = document.createElement("input");
	hiddenID.setAttribute("id", "updateid");
	hiddenID.setAttribute("name", "updateid");
	hiddenID.setAttribute("type", "text");
	hiddenID.setAttribute("value", material.name);
	hiddenID.setAttribute("style", "display: none;");
	form.appendChild(hiddenID);
	form = createNumberField(form, "u_normalScale", "Normal Scale", 0.0, 5.0, 0.01, material.u_normalScale);
	form = createNumberField(form, "u_heightScale", "Height Scale", 0.0, 0.1, 0.001, material.u_heightScale);
	form = createNumberField(form, "u_AOScale", "AO Intensity", 0.0, 1.0, 0.01, material.u_AOScale);
	form = createNumberField(form, "u_tiling_x", "Tiling X", 0, 10, 1, material.u_tiling_x);
	form = createNumberField(form, "u_tiling_y", "Tiling Y", 0, 10, 1, material.u_tiling_y);
	form = createNumberField(form, "u_roughnessRemap_x", "Roughness Remap Min", 0.0, 1.0, 0.01, material.u_roughnessRemap_x);
	form = createNumberField(form, "u_roughnessRemap_y", "Roughness Remap Max", 0.0, 1.0, 0.01, material.u_roughnessRemap_y);
	var previewButton = document.createElement("input");
    previewButton.setAttribute("type", "button");
    previewButton.setAttribute("value", "Preview");
    previewButton.setAttribute("onclick", 'window.open("preview.html?data_id=' + material.name + '","popup","width=500,height=500");');
	var updateButton = document.createElement("button");
	updateButton.setAttribute("type", "submit");
	updateButton.appendChild(document.createTextNode("Update Uniforms"))
	form.appendChild(previewButton);
    form.appendChild(updateButton);

    list.appendChild(header);
    list.appendChild(document.createTextNode("Default material uniforms"));
	list.appendChild(document.createElement("br"));
	list.appendChild(form);
	list.appendChild(document.createElement("br"));
    list.appendChild(document.createElement("br"));
    list.appendChild(document.createElement("br"));
});
		</script>
	</body>
</html>
