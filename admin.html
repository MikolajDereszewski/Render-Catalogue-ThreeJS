		<h1>Texture Catalogue CMS</h1>
		<script>
function createImageURL(textureName) {
	var file = document.getElementById(textureName).files[0];
	var url = window.URL.createObjectURL(new Blob([file], {type: "image/png"}));
	return url;
}

function openPreviewWindow() {
	var basemap = createImageURL("basemap");
	var normal = createImageURL("normal");
	var metallic = createImageURL("metallic");
	var roughness = createImageURL("roughness");
	var AO = createImageURL("AO");
	var height = createImageURL("height");
	
	var url = "preview.html?data_id=&basemap="+basemap+"&normal="+normal+"&metallic="+metallic+"&roughness="+roughness+"&AO="+AO+"&height="+height;
	window.open(url,'popup','width=500,height=500');
}
		</script>
