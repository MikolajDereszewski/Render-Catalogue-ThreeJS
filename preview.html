<!DOCTYPE html>
<html>
    <head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<title>Preview</title>
		<link rel="stylesheet" href="styles.css">
	</head>
    <body style="margin:0px">
        <div id="data_id" style="display: none;"></div>
        <div id="basemap" style="display: none;"></div>
        <div id="normal" style="display: none;"></div>
        <div id="metallic" style="display: none;"></div>
        <div id="roughness" style="display: none;"></div>
        <div id="AO" style="display: none;"></div>
        <div id="height" style="display: none;"></div>
        <script src="node_modules/three/build/three.min.js"></script>
		<script src="node_modules/three/examples/js/controls/OrbitControls.js"></script>
		<script src="node_modules/stats.js/build/stats.min.js"></script>
		<script src="node_modules/dat.gui/build/dat.gui.min.js"></script>
        <script src="engine.js"></script>
        <script src="utilities.js"></script>
        <script src="previewContent.js"></script>
        <script>
const params = new URLSearchParams(window.location.search);

function appendParameter(parameter) {
    let value = params.get(parameter);
    if(value != null && value != "") {
        document.getElementById(parameter).innerHTML = value;
        return true;
    }
    return false;
}

if(!appendParameter("data_id")) {
    appendParameter("basemap");
    appendParameter("normal");
    appendParameter("metallic");
    appendParameter("roughness");
    appendParameter("AO");
    appendParameter("height");
}

initializeGameContent();
        </script>
    </body>
</html>
